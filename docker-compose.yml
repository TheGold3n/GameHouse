services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamehouse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/players.db
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamehouse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-data:
    name: gamehouse-backend-data

