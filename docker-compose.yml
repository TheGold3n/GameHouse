services:
  db:
    image: postgres:15-alpine
    container_name: gamehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamehouse
      POSTGRES_PASSWORD: gamehouse_password
      POSTGRES_DB: gamehouse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamehouse -d gamehouse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamehouse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://gamehouse:gamehouse_password@db:5432/gamehouse_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamehouse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
    name: gamehouse-postgres-data
  backend-data:
    name: gamehouse-backend-data

